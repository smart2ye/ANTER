<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غير متصل</title>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            direction: rtl;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .icon { font-size: 80px; margin-bottom: 20px; }
        h1 { color: #1877f2; }
        p { color: #65676b; }
        .btn {
            display: inline-block;
            background: #1877f2;
            color: #fff;
            padding: 10px 30px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 20px;
        }
        .btn:hover { background: #0d65d9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>غير متصل بالإنترنت</h1>
        <p>يرجى التحقق من اتصالك بالشبكة والمحاولة مرة أخرى.</p>
        <a href="/" class="btn">المحاولة مجدداً</a>
    </div>
</body>
</html>
