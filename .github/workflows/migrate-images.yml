name: Migrate Large Images
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run or apply'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --quiet psycopg2-binary Pillow SQLAlchemy Flask Flask-SQLAlchemy python-dotenv
      - name: Run migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL secret is missing"
            exit 1
          fi
          python3 scripts/migrate_large_images.py --${{ inputs.mode }}
