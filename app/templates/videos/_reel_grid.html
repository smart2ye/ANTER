{% if videos %}
<div class="reels-grid" role="list" aria-label="ريلزات ANTER">
    {% for video in videos %}
    <article class="reel-card" role="listitem">
        <a href="{{ url_for('videos.watch', public_id=video.public_id) }}"
           class="reel-card-link"
           aria-label="تشغيل ريل: {{ video.title or 'فيديو بدون عنوان' }}">
            <div class="reel-card-media">
                <img src="{{ url_for('media.video_thumbnail', public_id=video.public_id) }}"
                     alt="صورة معاينة ريل {{ video.title or '' }}"
                     loading="lazy"
                     decoding="async">
                <span class="reel-play-badge" aria-hidden="true"><i class="fas fa-play"></i></span>
                <span class="reel-duration" aria-label="ريل عمودي"><i class="fas fa-film"></i> ريل</span>
                <div class="reel-card-gradient"></div>
                <div class="reel-card-copy">
                    <h2>{{ video.title or 'ريل جديد' }}</h2>
                    <span><i class="fas fa-eye" aria-hidden="true"></i> {{ video.views }} مشاهدة</span>
                </div>
            </div>
        </a>
    </article>
    {% endfor %}
</div>
{% else %}
<section class="reels-empty-state text-center" aria-labelledby="no-reels-heading">
    <div class="reels-empty-icon"><i class="fas fa-video" aria-hidden="true"></i></div>
    <h2 id="no-reels-heading">لا توجد ريلزات بعد</h2>
    <p>شارك مقطعاً عمودياً قصيراً وابدأ المحادثة في مجتمع ANTER.</p>
    <a href="{{ url_for('videos.upload') }}" class="btn btn-primary reels-upload-empty-btn">
        <i class="fas fa-upload" aria-hidden="true"></i> رفع أول ريل
    </a>
</section>
{% endif %}
