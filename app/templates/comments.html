<!-- ============================== -->
<!-- قائمة التعليقات -->
<!-- ============================== -->
<div class="comments-list">
    {% if post.comments %}
        {% for comment in post.comments %}
        <div class="comment-item" id="comment-{{ comment.id }}">
            <img src="{{ url_for('static', filename='uploads/' + comment.author.avatar) }}"
                 class="comment-avatar"
                 alt="{{ comment.author.name }}">
            <div class="comment-content">
                <div class="comment-author">
                    {{ comment.author.name }}
                    {% if comment.author.is_verified %}
                        <i class="fas fa-check-circle verified-badge" style="font-size: 0.6rem;" title="حساب موثق"></i>
                    {% endif %}
                    <span class="comment-time">· {{ comment.created_at.strftime('%H:%M · %d/%m') }}</span>
                </div>
                <div class="comment-text">{{ comment.content }}</div>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <div class="text-center text-muted py-3">
            <i class="far fa-comment-dots fa-2x mb-2" style="opacity: 0.3;"></i>
            <p class="mb-0 small">لا توجد تعليقات بعد، كن أول من يعلق!</p>
        </div>
    {% endif %}
</div>

<!-- ============================== -->
<!-- نموذج إضافة تعليق جديد -->
<!-- ============================== -->
<div class="comment-form-wrapper mt-3">
    <form method="POST" action="{{ url_for('posts.comment', post_id=post.id) }}" class="comment-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

        <div class="d-flex gap-2">
            <img src="{{ url_for('static', filename='uploads/' + current_user.avatar) }}"
                 class="comment-avatar"
                 alt="{{ current_user.name }}"
                 style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0;">
            <div class="flex-grow-1">
                <input type="text"
                       name="content"
                       class="form-control form-control-sm rounded-pill"
                       placeholder="اكتب تعليقك..."
                       required
                       style="background: var(--fb-bg); border: 1px solid var(--fb-border);">
            </div>
            <button type="submit" class="btn btn-primary btn-sm rounded-pill px-3">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </form>
</div>
