<div class="feed-find-friends" id="feed-find-friends" hidden>
    <div class="feed-find-friends-body">
        <div class="feed-find-friends-text">
            <i class="fas fa-address-book" aria-hidden="true"></i>
            <div>
                <strong>اكتشف أشخاصًا قد تعرفهم</strong>
                <small id="find-friends-status">اقتراحات مخصصة لك</small>
            </div>
        </div>
        <button type="button" id="find-friends-btn" class="btn btn-sm btn-primary" style="display:none;">
            <i class="fas fa-magic"></i> اقترح
        </button>
    </div>
    <div id="find-friends-results" class="find-friends-results"></div>
</div>

<style>
.feed-find-friends {
    margin: 12px 0;
    padding: 14px 16px;
    border-radius: 14px;
    background: linear-gradient(135deg, #eef4ff 0%, #f7f5ff 100%);
    border: 1px solid #dbe7ff;
}
.feed-find-friends-body {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
}
.feed-find-friends-text {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}
.feed-find-friends-text i {
    font-size: 22px;
    color: #003AAB;
    flex-shrink: 0;
}
.feed-find-friends-text strong {
    display: block;
    color: #1a1a1a;
    font-size: 15px;
}
.feed-find-friends-text small {
    color: #6b7280;
    font-size: 12px;
}
.find-friends-results {
    margin-top: 12px;
    display: none;
}
.find-friends-results.is-visible {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 2px 2px 8px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.find-friends-results.is-visible::-webkit-scrollbar {
    display: none;
}
.find-friend-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 12px 10px;
    border-radius: 14px;
    background: #fff;
    text-decoration: none;
    color: inherit;
    border: 1px solid #eef1f7;
    flex: 0 0 150px;
    width: 150px;
    scroll-snap-align: start;
    text-align: center;
}
.find-friend-item:hover {
    border-color: #cfe0ff;
    background: #f5f9ff;
}
.find-friend-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 2px solid #eef1f7;
}
.find-friend-item > div {
    width: 100%;
    min-width: 0;
}
.find-friend-item strong {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #1a1a1a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.find-friend-item small {
    display: block;
    color: #6b7280;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
}
.find-friend-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
    min-width: 0;
    text-decoration: none;
    color: inherit;
}
.find-friend-follow {
    border: none;
    border-radius: 999px;
    padding: 7px 18px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    width: 100%;
    margin-top: 2px;
}
.find-friend-follow.follow-btn-primary {
    background: #003AAB;
    color: #fff;
}
.find-friend-follow.follow-btn-primary:hover {
    background: #0B5ED7;
}
.find-friend-follow.follow-btn-outline {
    background: #fff;
    color: #003AAB;
    border: 1px solid #003AAB;
}
.find-friend-follow.follow-btn-outline:hover {
    background: #f0f7ff;
}
.find-friend-follow:disabled {
    opacity: 0.6;
    cursor: wait;
}
</style>

<script>
(function() {
    var root = document.getElementById('feed-find-friends');
    if (!root) return;

    // لا نُظهر القسم إلا في تطبيق ANTER (حيث يوجد الجسر)
    if (!window.AnterContacts) {
        return;
    }

    root.hidden = false;

    var btn = document.getElementById('find-friends-btn');
    var status = document.getElementById('find-friends-status');
    var results = document.getElementById('find-friends-results');

    // ANTER: استدعاء تلقائي — لا ننتظر ضغط زر.
    function _autoRequestHashes() {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ البحث';
        status.textContent = 'نقرأ جهات اتصالك...';
        try {
            window.AnterContacts.requestHashes();
        } catch (e) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-search"></i> ابحث';
            status.textContent = 'تعذر توليد الاقتراحات.';
        }
    }

    // تأخير بسيط لضمان تحميل الجسر بعد DOMContentLoaded
    if (document.readyState === 'complete') {
        setTimeout(_autoRequestHashes, 300);
    } else {
        window.addEventListener('load', function() { setTimeout(_autoRequestHashes, 300); });
    }

    btn.addEventListener('click', function() {
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ البحث';
        status.textContent = 'جارٍ توليد الاقتراحات...';
        results.classList.remove('is-visible');
        results.innerHTML = '';
        try {
            window.AnterContacts.requestHashes();
        } catch (e) {
            status.textContent = 'تعذر توليد الاقتراحات الآن.';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-search"></i> ابحث';
        }
    });

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
    }

    function renderResults(items) {
        if (!items.length) {
            results.innerHTML = '<p class="text-muted small mb-0">لا توجد اقتراحات حاليًا. جرّب لاحقًا.</p>';
        } else {
            results.innerHTML = items.map(function(u) {
                var name = escapeHtml(u.name || u.username);
                var uname = escapeHtml(u.username);
                var avatar = '/media/avatar/' + u.id;
                var btnClass = u.isFollowing ? 'follow-btn-outline' : 'follow-btn-primary';
                var btnText = u.isFollowing ? 'إلغاء' : 'متابعة';
                return '<div class="find-friend-item">' +
                       '<a href="/users/' + uname + '" class="find-friend-link">' +
                       '<img src="' + avatar + '" alt="" class="find-friend-avatar" loading="lazy">' +
                       '<div><strong>' + name + '</strong><small>@' + uname + '</small></div>' +
                       '</a>' +
                       '<button type="button" class="find-friend-follow ' + btnClass + '"' +
                       ' data-user-id="' + u.id + '" data-following="' + (u.isFollowing ? 'true' : 'false') + '">' +
                       btnText + '</button>' +
                       '</div>';
            }).join('');

            // ربط أزرار المتابعة
            results.querySelectorAll('.find-friend-follow').forEach(function(btn) {
                btn.addEventListener('click', async function() {
                    var uid = btn.dataset.userId;
                    var isFollowing = btn.dataset.following === 'true';
                    var url = isFollowing ? '/users/unfollow/' + uid : '/users/follow/' + uid;

                    btn.disabled = true;
                    try {
                        var res = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'X-Requested-With': 'XMLHttpRequest'
                            }
                        });
                        var data = await res.json();
                        if (data.success) {
                            var nowFollowing = !!data.following;
                            btn.dataset.following = nowFollowing ? 'true' : 'false';
                            btn.textContent = nowFollowing ? 'إلغاء' : 'متابعة';
                            btn.classList.toggle('follow-btn-primary', !nowFollowing);
                            btn.classList.toggle('follow-btn-outline', nowFollowing);
                        }
                    } catch (e) {
                        // silent
                    } finally {
                        btn.disabled = false;
                    }
                });
            });
        }
        results.classList.add('is-visible');
    }

    window.onAnterHashesReceived = async function(hashes) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-magic"></i> إعادة';
        btn.style.display = '';

        if (!Array.isArray(hashes) || hashes.length === 0) {
            status.textContent = 'لا توجد جهات اتصال مطابقة.';
            return;
        }

        status.textContent = 'نُحضّر الاقتراحات...';
        try {
            var csrfMeta = document.querySelector('meta[name="csrf-token"]');
            var csrf = csrfMeta ? csrfMeta.getAttribute('content') : '';
            var res = await fetch('/users/find-friends', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrf
                },
                body: JSON.stringify({ hashes: hashes })
            });
            var data = await res.json();
            if (!data.success) {
                status.textContent = data.message || 'فشل البحث.';
                return;
            }
            status.textContent = data.matched > 0
                ? ('لديك ' + data.matched + ' اقتراحًا.')
                : 'لا توجد اقتراحات حاليًا.';
            renderResults(data.suggested || []);
        } catch (e) {
            status.textContent = 'تعذر الاتصال بالخادم.';
        }
    };
})();
</script>
