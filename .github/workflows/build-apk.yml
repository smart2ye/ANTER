name: Build ANTER APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK from PWA
        uses: shubham-singh-08/pwa-to-apk-action@v2
        with:
          app_url: "https://anter-1.onrender.com/"
          app_name: "ANTER"
          app_package: "com.smart2ye.anter"
          app_icon: ""  # اتركه فارغاً أو ضع رابط الأيقونة 512x512

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANTER-App
          path: ./app.apk
