name: Build ANTER APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5     # تم الترقية من v4 إلى v5 لدعم Node.js 24[reference:4][reference:5]

      - name: Set up Java
        uses: actions/setup-java@v5   # تم الترقية من v4 إلى v5 لدعم Node.js 24[reference:6][reference:7]
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK from PWA
        uses: youseftarekdev/pwa-to-apk-action@main
        with:
          app_url: "https://anter-1.onrender.com/"
          app_name: "ANTER"
          app_package: "com.smart2ye.anter"
          app_icon_path: "./icon.png"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v5  # تم الترقية من v4 إلى v5[reference:8]
        with:
          name: ANTER-App
          path: ./app.apk
