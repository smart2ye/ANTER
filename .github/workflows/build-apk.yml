name: Build WebView APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build WebView APK
        run: |
          git clone https://github.com/youssef-devx/webview-apk.git
          cd webview-apk
          echo "const WEB_URL = 'https://anter-1.onrender.com/';" > app/src/main/java/com/webview/app/Config.java
          # إنشاء ملف الأيقونة (اختياري)
          cp ../icon.png app/src/main/res/drawable/icon.png || true
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ANTER-App.apk
          cd ..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANTER-App
          path: ./ANTER-App.apk
