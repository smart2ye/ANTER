{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4>المتفاعلين مع المنشور #{{ post.id }}</h4>
        </div>
        <div class="card-body">
            <p>عدد المتفاعلين: {{ users|length }}</p>
            <ul class="list-group">
            {% for user in users %}
                <li class="list-group-item"><a href="{{ url_for("users.profile", username=user.username) }}" class="text-decoration-none fw-bold">{{ user.username }}</a></li>
            {% endfor %}
            </ul>
        </div>
        <div class="card-footer">
            <a href="{{ url_for('main.index') }}" class="btn btn-secondary">⬅ العودة</a>
        </div>
    </div>
</div>
{% endblock %}
