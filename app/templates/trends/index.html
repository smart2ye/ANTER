{% extends "base.html" %}
{% block content %}
<h5 class="mb-3"><i class="fas fa-fire text-danger"></i> التريندات</h5>
<p class="text-muted small">المنشورات الأكثر تفاعلاً خلال آخر 24 ساعة</p>
{% if posts %}
    {% for post in posts %}
        {% include "_post_card.html" %}
    {% endfor %}
{% else %}
    <div class="text-center text-muted mt-5">
        <i class="fas fa-fire fa-3x mb-3"></i>
        <h5>لا توجد تريندات حالياً</h5>
        <p>تفاعل مع المنشورات لظهور التريندات.</p>
    </div>
{% endif %}
{% endblock %}
