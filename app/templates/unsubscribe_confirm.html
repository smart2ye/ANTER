{% extends "base.html" %}
{% block meta_robots %}noindex, nofollow{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 480px;">
    <div class="card border-0 shadow-sm p-4 text-center" style="border-radius: 18px;">
        <div style="width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; background: rgba(220,38,38,0.1); color: #dc2626; font-size: 1.6rem;">
            <i class="fas fa-envelope-open-text"></i>
        </div>
        <h1 class="h5 fw-bold mb-2">إلغاء الاشتراك</h1>
        <p class="text-muted small mb-4">
            هل تريد إلغاء الاشتراك في رسائل البريد من أنتر؟
            <br>
            <strong>{{ user.email }}</strong>
        </p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-danger w-100 mb-2">نعم، ألغِ الاشتراك</button>
            <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary w-100">لا، تراجع</a>
        </form>
    </div>
</div>
{% endblock %}
